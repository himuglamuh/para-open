name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Build, test, and publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # required for npm provenance via OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Upgrade npm to a version that supports OIDC trusted publishing
        # npm trusted publishing auto-detection requires npm >= 11.5.1.
        # Node 22 ships with npm 10.x. We pin to 11.x and use --force to
        # bypass a known npm 10 -> 11 self-upgrade bug where reify fails
        # with MODULE_NOT_FOUND on transitive deps.
        run: |
          npm install -g npm@11 --force
          npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Strip placeholder _authToken so npm uses OIDC
        # actions/setup-node writes a placeholder NODE_AUTH_TOKEN into the
        # npmrc when registry-url is set. With OIDC trusted publishing we
        # don't supply a real NODE_AUTH_TOKEN, and the placeholder string
        # would be sent as a Bearer token, causing npm to reject the publish
        # with a misleading 404. Removing the line lets npm fall back to
        # OIDC token exchange via the workflow's id-token permission.
        run: |
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            echo "Stripped _authToken from $NPM_CONFIG_USERCONFIG"
          fi

      - run: npm publish --provenance --access public
